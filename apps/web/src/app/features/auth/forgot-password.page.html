<app-auth-shell
  title="Esqueceu a senha?"
  lead="Enviaremos um link para criar uma nova senha."
  footLead="Lembrou a senha?"
  footLabel="Entrar"
  footLink="/login"
>
  @if (sent()) {
  <p class="success" role="status">
    Se este e-mail estiver cadastrado, enviamos um link para redefinir a senha.
  </p>
  <a class="btn-primary" routerLink="/login">Voltar para o login</a>
  } @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate aria-describedby="forgot-form-error">
    <div class="field">
      <label for="forgot-email">E-mail</label>
      <input
        id="forgot-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="voce@email.com"
        [attr.aria-invalid]="error('email') !== null"
      />
      @if (error('email')) {
      <small class="error">{{ error('email') }}</small>
      }
    </div>

    @if (serverError()) {
    <p id="forgot-form-error" class="banner" role="alert">{{ serverError() }}</p>
    }

    <button class="btn-primary" type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Enviando...' : 'Enviar link' }}
    </button>
  </form>
  }
</app-auth-shell>
