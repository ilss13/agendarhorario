<app-auth-shell
  title="Acesse sua conta"
  footLead="Começando agora?"
  footLabel="Crie uma conta"
  footLink="/registrar-empresa"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate aria-describedby="login-form-error">
    <div class="field">
      <label for="login-email">E-mail</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="voce@email.com"
        [attr.aria-invalid]="error('email') !== null"
      />
      @if (error('email')) {
      <small class="error">{{ error('email') }}</small>
      }
    </div>

    <div class="field">
      <div class="field-row">
        <label for="login-senha">Senha</label>
        <a class="forgot forgot-full" routerLink="/esqueci-senha">Esqueceu a senha?</a>
        <a class="forgot forgot-short" routerLink="/esqueci-senha">Esqueceu?</a>
      </div>
      <input
        id="login-senha"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
        [attr.aria-invalid]="error('password') !== null"
      />
      @if (error('password')) {
      <small class="error">{{ error('password') }}</small>
      }
    </div>

    <label class="remember">
      <input type="checkbox" formControlName="rememberMe" />
      <span class="remember-full">Lembrar de mim neste dispositivo</span>
      <span class="remember-short">Lembrar de mim</span>
    </label>

    @if (serverError()) {
    <p id="login-form-error" class="banner" role="alert">{{ serverError() }}</p>
    }

    <button class="btn-primary" type="submit" [disabled]="form.invalid || busy()">
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  @if (googleEnabled) {
  <div class="divider"><span>Ou faça login com</span></div>
  <button type="button" class="btn-google" (click)="onGoogle()" [disabled]="busy()">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path
        fill="#4285F4"
        d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
      ></path>
      <path
        fill="#34A853"
        d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"
      ></path>
      <path
        fill="#FBBC05"
        d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"
      ></path>
      <path
        fill="#EA4335"
        d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"
      ></path>
    </svg>
    {{ googleSubmitting() ? 'Conectando...' : 'Google' }}
  </button>
  }
</app-auth-shell>
