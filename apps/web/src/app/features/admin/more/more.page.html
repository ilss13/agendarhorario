<header class="heading">
  <h1>Mais</h1>
  <p>Configurações da sua empresa.</p>
</header>

<div class="profile">
  <div class="avatar" aria-hidden="true">{{ initial(auth.user()?.name) }}</div>
  <div>
    <div class="name">{{ auth.user()?.name }}</div>
    @if (company()?.slug) {
    <div class="slug">{{ company()!.slug }}</div>
    }
  </div>
</div>

<nav class="menu" aria-label="Configurações">
  <a routerLink="../clientes">
    <span class="icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"></circle>
        <path
          d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        ></path>
      </svg>
    </span>
    <span class="label">Clientes</span>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 6l6 6-6 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
  </a>
  <a routerLink="../empresa">
    <span class="icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect
          x="4"
          y="3.5"
          width="16"
          height="17"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        ></rect>
        <path
          d="M9 21v-4.5h6V21M8 8h1M8 11.5h1M8 15h1M15 8h1M15 11.5h1"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        ></path>
      </svg>
    </span>
    <span class="label">Empresa</span>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 6l6 6-6 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
  </a>
  <a routerLink="../excecoes">
    <span class="icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect
          x="3.5"
          y="5"
          width="17"
          height="15.5"
          rx="3"
          stroke="currentColor"
          stroke-width="1.8"
        ></rect>
        <path
          d="M3.5 9.8h17M9 14.3h6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        ></path>
      </svg>
    </span>
    <span class="label">Exceções / Feriados</span>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 6l6 6-6 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
  </a>
  <a routerLink="../assinatura">
    <span class="icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect
          x="3"
          y="5.5"
          width="18"
          height="13"
          rx="2.5"
          stroke="currentColor"
          stroke-width="1.8"
        ></rect>
        <path d="M3 9.8h18" stroke="currentColor" stroke-width="1.8"></path>
      </svg>
    </span>
    <span class="label">Assinatura</span>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 6l6 6-6 6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
  </a>
</nav>

<button type="button" class="logout" (click)="onLogout()">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path
      d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    ></path>
    <path
      d="M16 17l5-5-5-5M21 12H9"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    ></path>
  </svg>
  Sair
</button>

<div class="powered">
  <span class="powered-mark" aria-hidden="true">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
      <rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="#fff" stroke-width="2.4"></rect>
      <path
        d="M8.3 14.6l2 2 4.2-4.4"
        stroke="#3fd6c6"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></path>
    </svg>
  </span>
  <span>Powered by <strong>agendarhorario.com</strong></span>
</div>
