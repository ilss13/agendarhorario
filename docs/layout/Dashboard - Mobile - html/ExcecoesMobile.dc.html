<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Exceções (mobile)</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #f2f7f8;
            --surface-100: #ffffff;
            --surface-200: #f2f7f8;
            --ink: #0b2530;
            --ink-muted: #4c6672;
            --border: #8fb0b7;
            --brand-navy: #185280;
            --brand-teal: #0f9e9e;
            --brand-teal-dark: #09424b;
            --danger: #a3332b;
            --danger-bg: #fbecea;
            --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-full: 999px;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: var(--brand-teal-dark);
          }
          button {
            font-family: inherit;
            cursor: pointer;
          }
          input,
          select,
          textarea {
            font-family: inherit;
          }
          ::placeholder {
            color: var(--ink-muted);
            opacity: 0.7;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; min-height: 100%; background: var(--surface-200); position: relative"
      >
        <div
          style="
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--surface-100);
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
          "
        >
          <a
            href="MaisMobile.dc.html"
            aria-label="Voltar para Mais"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              width: 32px;
              height: 32px;
              flex-shrink: 0;
              color: var(--ink);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </a>
          <div
            style="
              font-family: var(--font-display);
              font-weight: 600;
              font-size: 16px;
              color: var(--ink);
            "
          >
            Exceções / Feriados
          </div>
        </div>

        <div style="padding: 20px 18px 110px; display: flex; flex-direction: column; gap: 18px">
          <div
            style="
              background: var(--surface-100);
              border: 1px solid var(--border);
              border-radius: var(--radius-md);
              padding: 20px;
              display: flex;
              flex-direction: column;
              gap: 16px;
            "
          >
            <div>
              <label
                for="excm-data"
                style="
                  display: block;
                  margin-bottom: 6px;
                  font-family: var(--font-sans);
                  font-size: 11px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  color: var(--ink-muted);
                "
                >Data</label
              >
              <input
                id="excm-data"
                type="date"
                value="2026-09-21"
                style="
                  width: 100%;
                  padding: 12px 14px;
                  border: 1px solid var(--border);
                  border-radius: var(--radius-sm);
                  font-size: 15px;
                  color: var(--ink);
                  background: var(--surface-100);
                "
              />
            </div>
            <div>
              <label
                for="excm-motivo"
                style="
                  display: block;
                  margin-bottom: 6px;
                  font-family: var(--font-sans);
                  font-size: 11px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  color: var(--ink-muted);
                "
                >Motivo (opcional)</label
              >
              <input
                id="excm-motivo"
                type="text"
                placeholder="Feriado, férias, evento..."
                style="
                  width: 100%;
                  padding: 12px 14px;
                  border: 1px solid var(--border);
                  border-radius: var(--radius-sm);
                  font-size: 15px;
                  color: var(--ink);
                  background: var(--surface-100);
                "
              />
            </div>
            <label style="display: flex; align-items: center; gap: 10px">
              <input
                type="checkbox"
                checked=""
                style="width: 18px; height: 18px; accent-color: var(--brand-teal-dark)"
              />
              <span style="font-family: var(--font-sans); font-size: 14px; color: var(--ink)"
                >Dia inteiro</span
              >
            </label>
            <button
              type="button"
              onClick="{{addException}}"
              style="
                width: 100%;
                background: var(--brand-teal-dark);
                color: #ffffff;
                border: none;
                border-radius: var(--radius-sm);
                padding: 14px;
                font-family: var(--font-sans);
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.02em;
                text-transform: uppercase;
              "
            >
              Adicionar exceção
            </button>
          </div>

          <div>
            <div
              style="
                font-family: var(--font-display);
                font-size: 15px;
                font-weight: 600;
                color: var(--ink);
                margin-bottom: 12px;
              "
            >
              Exceções cadastradas
            </div>

            <sc-if value="{{hasExceptions}}" hint-placeholder-val="{{false}}" hint-invert="true">
              <div
                style="
                  background: var(--surface-100);
                  border: 1px solid var(--border);
                  border-radius: var(--radius-md);
                  padding: 36px 20px;
                  text-align: center;
                "
              >
                <div
                  style="
                    font-family: var(--font-sans);
                    font-size: 14px;
                    font-weight: 600;
                    color: var(--ink);
                    margin-bottom: 4px;
                  "
                >
                  Nenhuma exceção
                </div>
                <div
                  style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-muted)"
                >
                  Cadastre feriados ou bloqueios pontuais acima.
                </div>
              </div>
            </sc-if>

            <sc-if value="{{hasExceptions}}" hint-placeholder-val="{{true}}">
              <div
                style="
                  background: var(--surface-100);
                  border: 1px solid var(--border);
                  border-radius: var(--radius-md);
                  overflow: hidden;
                "
              >
                <sc-for list="{{exceptions}}" as="exc" hint-placeholder-count="2">
                  <div
                    style="
                      padding: 14px 18px;
                      border-top: 1px solid var(--surface-200);
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      gap: 12px;
                    "
                  >
                    <div>
                      <div
                        style="
                          font-family: var(--font-sans);
                          font-size: 14px;
                          font-weight: 600;
                          color: var(--ink);
                        "
                      >
                        {{exc.date}}
                      </div>
                      <div
                        style="
                          font-family: var(--font-sans);
                          font-size: 12px;
                          color: var(--ink-muted);
                        "
                      >
                        {{exc.reason}} · {{exc.type}}
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick="{{exc.remove}}"
                      style="
                        background: transparent;
                        border: none;
                        color: var(--danger);
                        font-family: var(--font-sans);
                        font-size: 12px;
                        font-weight: 600;
                      "
                    >
                      Remover
                    </button>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </div>

        <nav
          aria-label="Navegação principal"
          style="
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9;
            background: var(--surface-100);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 4px 10px;
          "
        >
          <a
            href="MainMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
            >
              <rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect>
              <path d="M3.5 9.8h17"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Agenda</span
            >
          </a>
          <a
            href="ServicosMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="7" cy="7" r="2.6"></circle>
              <circle cx="7" cy="17" r="2.6"></circle>
              <path d="M20 5.5L8.8 15M9.6 8.6L20 18.5"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Serviços</span
            >
          </a>
          <a
            href="HorariosMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 2"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Horários</span
            >
          </a>
          <a
            href="MaisMobile.dc.html"
            aria-current="page"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--brand-navy);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
              <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Mais</span
            >
          </a>
        </nav>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { exceptions: [] };
        }
        addException() {
          const list = this.state.exceptions.slice();
          list.push({ id: Date.now(), date: '21/09/2026', reason: 'Feriado, férias, evento...', type: 'Dia inteiro' });
          this.setState({ exceptions: list });
        }
        removeException(id) {
          this.setState({ exceptions: this.state.exceptions.filter(e => e.id !== id) });
        }
        renderVals() {
          const exceptions = this.state.exceptions.map(e => ({
            date: e.date,
            reason: e.reason,
            type: e.type,
            remove: () => this.removeException(e.id)
          }));
          return {
            exceptions,
            hasExceptions: exceptions.length > 0,
            addException: () => this.addException()
          };
        }
      }
    </script>
  </body>
</html>
