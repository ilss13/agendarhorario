<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Login (mobile)</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #f2f7f8;
            --surface-100: #ffffff;
            --surface-200: #f2f7f8;
            --ink: #0b2530;
            --ink-muted: #4c6672;
            --border: #8fb0b7;
            --brand-navy: #185280;
            --brand-teal: #0f9e9e;
            --brand-teal-dark: #09424b;
            --danger: #a3332b;
            --danger-bg: #fbecea;
            --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-full: 999px;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: var(--brand-teal-dark);
          }
          button {
            font-family: inherit;
            cursor: pointer;
          }
          input {
            font-family: inherit;
          }
          ::placeholder {
            color: var(--ink-muted);
            opacity: 0.55;
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          width: 100%;
          min-height: 100%;
          background: var(--surface-200);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        "
      >
        <!-- Decorative brand blobs -->
        <div
          style="
            position: absolute;
            top: -160px;
            right: -160px;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(
              circle at 30% 30%,
              rgba(15, 158, 158, 0.22),
              rgba(24, 82, 128, 0.3)
            );
            pointer-events: none;
          "
        ></div>
        <div
          style="
            position: absolute;
            bottom: -180px;
            left: -140px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(
              circle at 60% 60%,
              rgba(24, 82, 128, 0.12),
              rgba(15, 158, 158, 0.1)
            );
            pointer-events: none;
          "
        ></div>

        <!-- Logo -->
        <div style="position: relative; padding: 26px 20px 8px">
          <img
            src="./assets/1c5b356b96c364e9648800bad6285aa9.png"
            alt="Agendar Horário"
            style="height: 26px; width: auto; display: block"
          />
        </div>

        <!-- Card -->
        <div
          style="
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 18px 40px;
          "
        >
          <div
            style="
              width: 100%;
              background: var(--surface-100);
              border: 1px solid var(--border);
              border-radius: var(--radius-md);
              box-shadow: 0 20px 40px -18px rgba(11, 37, 48, 0.18);
              overflow: hidden;
            "
          >
            <div style="padding: 26px 24px 22px">
              <h1
                style="
                  margin: 0 0 22px;
                  font-family: var(--font-display);
                  font-size: 20px;
                  line-height: 26px;
                  font-weight: 700;
                  color: var(--ink);
                "
              >
                Acesse sua conta
              </h1>

              <div style="display: flex; flex-direction: column; gap: 14px">
                <div>
                  <label
                    for="login-email-m"
                    style="
                      display: block;
                      margin-bottom: 6px;
                      font-family: var(--font-sans);
                      font-size: 13px;
                      font-weight: 600;
                      color: var(--ink);
                    "
                    >E-mail</label
                  >
                  <input
                    id="login-email-m"
                    type="email"
                    value="{{email}}"
                    onChange="{{setEmail}}"
                    placeholder="voce@email.com"
                    style="
                      width: 100%;
                      padding: 12px 14px;
                      border: 1px solid var(--border);
                      border-radius: var(--radius-sm);
                      font-size: 15px;
                      color: var(--ink);
                      background: var(--surface-100);
                    "
                  />
                </div>
                <div>
                  <div
                    style="
                      display: flex;
                      align-items: baseline;
                      justify-content: space-between;
                      margin-bottom: 6px;
                    "
                  >
                    <label
                      for="login-senha-m"
                      style="
                        font-family: var(--font-sans);
                        font-size: 13px;
                        font-weight: 600;
                        color: var(--ink);
                      "
                      >Senha</label
                    >
                    <a
                      href="#"
                      style="font-family: var(--font-sans); font-size: 12px; font-weight: 600"
                      >Esqueceu?</a
                    >
                  </div>
                  <input
                    id="login-senha-m"
                    type="password"
                    value="{{password}}"
                    onChange="{{setPassword}}"
                    placeholder="••••••••"
                    style="
                      width: 100%;
                      padding: 12px 14px;
                      border: 1px solid var(--border);
                      border-radius: var(--radius-sm);
                      font-size: 15px;
                      color: var(--ink);
                      background: var(--surface-100);
                    "
                  />
                </div>

                <label style="display: flex; align-items: center; gap: 9px">
                  <input
                    type="checkbox"
                    checked="{{remember}}"
                    onChange="{{toggleRemember}}"
                    style="width: 17px; height: 17px; accent-color: var(--brand-teal-dark)"
                  />
                  <span
                    style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-muted)"
                    >Lembrar de mim</span
                  >
                </label>

                <button
                  type="button"
                  onClick="{{submit}}"
                  style="
                    width: 100%;
                    background: var(--brand-teal-dark);
                    color: #ffffff;
                    border: none;
                    border-radius: var(--radius-sm);
                    padding: 14px;
                    font-family: var(--font-sans);
                    font-size: 14px;
                    font-weight: 600;
                    margin-top: 2px;
                  "
                >
                  Entrar
                </button>
              </div>

              <div style="display: flex; align-items: center; gap: 12px; margin: 22px 0 16px">
                <div style="flex: 1; height: 1px; background: var(--surface-200)"></div>
                <span
                  style="
                    font-family: var(--font-sans);
                    font-size: 12px;
                    color: var(--ink-muted);
                    white-space: nowrap;
                  "
                  >Ou faça login com</span
                >
                <div style="flex: 1; height: 1px; background: var(--surface-200)"></div>
              </div>

              <button
                type="button"
                style="
                  width: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 10px;
                  background: var(--surface-100);
                  border: 1px solid var(--border);
                  border-radius: var(--radius-sm);
                  padding: 12px;
                  font-family: var(--font-sans);
                  font-size: 14px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                <svg width="18" height="18" viewBox="0 0 18 18">
                  <path
                    fill="#4285F4"
                    d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
                  ></path>
                  <path
                    fill="#34A853"
                    d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"
                  ></path>
                  <path
                    fill="#FBBC05"
                    d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"
                  ></path>
                  <path
                    fill="#EA4335"
                    d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"
                  ></path>
                </svg>
                Google
              </button>
            </div>

            <div
              style="
                background: var(--surface-200);
                padding: 15px 24px;
                text-align: center;
                border-top: 1px solid var(--surface-200);
              "
            >
              <span style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-muted)"
                >Começando agora?
              </span>
              <a href="#" style="font-family: var(--font-sans); font-size: 13px; font-weight: 600"
                >Crie uma conta</a
              >
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div
          style="
            position: relative;
            padding: 0 20px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
          "
        >
          <span style="font-family: var(--font-sans); font-size: 11px; color: var(--ink-muted)"
            >© Agendar Horário</span
          >
          <a href="#" style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
            >Início</a
          >
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { email: '', password: '', remember: true };
        }
        setEmail(e) { this.setState({ email: e.target.value }); }
        setPassword(e) { this.setState({ password: e.target.value }); }
        toggleRemember() { this.setState({ remember: !this.state.remember }); }
        submit() {}

        renderVals() {
          return {
            email: this.state.email,
            password: this.state.password,
            remember: this.state.remember,
            setEmail: (e) => this.setEmail(e),
            setPassword: (e) => this.setPassword(e),
            toggleRemember: () => this.toggleRemember(),
            submit: () => this.submit()
          };
        }
      }
    </script>
  </body>
</html>
