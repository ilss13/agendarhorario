<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Serviços (mobile)</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #f2f7f8;
            --surface-100: #ffffff;
            --surface-200: #f2f7f8;
            --ink: #0b2530;
            --ink-muted: #4c6672;
            --border: #8fb0b7;
            --brand-navy: #185280;
            --brand-teal: #0f9e9e;
            --brand-teal-dark: #09424b;
            --danger: #a3332b;
            --danger-bg: #fbecea;
            --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-full: 999px;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: var(--brand-teal-dark);
          }
          button {
            font-family: inherit;
            cursor: pointer;
          }
          input,
          select,
          textarea {
            font-family: inherit;
          }
          ::placeholder {
            color: var(--ink-muted);
            opacity: 0.7;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; min-height: 100%; background: var(--surface-200); position: relative"
      >
        <div
          style="
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--surface-100);
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <div style="display: flex; align-items: center; gap: 9px">
            <div
              style="
                width: 30px;
                height: 30px;
                border-radius: 9px;
                background: var(--brand-navy);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
              "
            >
              <span
                style="
                  font-family: var(--font-display);
                  font-weight: 700;
                  font-size: 14px;
                  color: #ffffff;
                "
                >D</span
              >
            </div>
            <div
              style="
                font-family: var(--font-display);
                font-weight: 700;
                font-size: 15px;
                color: var(--ink);
              "
            >
              Diva Studio
            </div>
          </div>
          <div
            style="
              width: 30px;
              height: 30px;
              border-radius: var(--radius-full);
              background: var(--surface-200);
              border: 1px solid var(--border);
              display: flex;
              align-items: center;
              justify-content: center;
              font-family: var(--font-sans);
              font-size: 13px;
              font-weight: 700;
              color: var(--brand-navy);
            "
          >
            I
          </div>
        </div>

        <div style="padding: 20px 18px 96px; display: flex; flex-direction: column; gap: 18px">
          <div
            style="display: flex; align-items: center; justify-content: space-between; gap: 12px"
          >
            <div>
              <h1
                style="
                  margin: 0 0 4px;
                  font-family: var(--font-display);
                  font-size: 22px;
                  line-height: 28px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                Serviços
              </h1>
              <p
                style="
                  margin: 0;
                  font-family: var(--font-sans);
                  font-size: 13px;
                  line-height: 18px;
                  color: var(--ink-muted);
                "
              >
                Atendimentos oferecidos.
              </p>
            </div>
            <button
              type="button"
              aria-label="Novo serviço"
              style="
                width: 44px;
                height: 44px;
                flex-shrink: 0;
                border-radius: var(--radius-full);
                background: var(--brand-teal-dark);
                color: #ffffff;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>
          </div>

          <div style="position: relative">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--ink-muted)"
              stroke-width="1.8"
              stroke-linecap="round"
              style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%)"
            >
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="M20 20l-4.3-4.3"></path>
            </svg>
            <label
              for="srvm-search"
              style="
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
              "
              >Buscar serviço por nome</label
            >
            <input
              id="srvm-search"
              type="text"
              placeholder="Buscar por nome..."
              style="
                width: 100%;
                padding: 12px 14px 12px 40px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: 15px;
                color: var(--ink);
                background: var(--surface-100);
              "
            />
          </div>

          <div
            style="
              background: var(--surface-100);
              border: 1px solid var(--border);
              border-radius: var(--radius-md);
              padding: 18px;
            "
          >
            <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px">
              <div
                style="
                  width: 42px;
                  height: 42px;
                  border-radius: var(--radius-md);
                  background: rgba(15, 158, 158, 0.12);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  flex-shrink: 0;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--brand-teal-dark)"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 15c2-5 4-8 8-8s6 3 8 8"></path>
                  <path d="M4 15c2 1.5 4.5 2.5 8 2.5s6-1 8-2.5"></path>
                </svg>
              </div>
              <div style="flex: 1">
                <div
                  style="
                    font-family: var(--font-sans);
                    font-size: 15px;
                    font-weight: 600;
                    color: var(--ink);
                  "
                >
                  Sombrancelha
                </div>
                <div
                  style="
                    font-family: var(--font-sans);
                    font-size: 13px;
                    color: var(--ink-muted);
                    margin-top: 2px;
                  "
                >
                  30 min · R$ 50,00
                </div>
              </div>
              <span
                style="
                  font-family: var(--font-sans);
                  font-size: 10px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  padding: 4px 10px;
                  border-radius: 999px;
                  background: rgba(15, 158, 158, 0.14);
                  color: var(--brand-teal-dark);
                "
                >Ativo</span
              >
            </div>
            <div style="display: flex; gap: 8px">
              <button
                type="button"
                style="
                  flex: 1;
                  background: transparent;
                  border: 1px solid var(--border);
                  border-radius: var(--radius-sm);
                  padding: 11px;
                  font-family: var(--font-sans);
                  font-size: 12px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  color: var(--ink);
                "
              >
                Editar
              </button>
              <button
                type="button"
                style="
                  flex: 1;
                  background: transparent;
                  border: 1px solid var(--danger);
                  border-radius: var(--radius-sm);
                  padding: 11px;
                  font-family: var(--font-sans);
                  font-size: 12px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  color: var(--danger);
                "
              >
                Remover
              </button>
            </div>
          </div>
        </div>

        <nav
          aria-label="Navegação principal"
          style="
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9;
            background: var(--surface-100);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 4px 10px;
          "
        >
          <a
            href="MainMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
            >
              <rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect>
              <path d="M3.5 9.8h17"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Agenda</span
            >
          </a>
          <a
            href="ServicosMobile.dc.html"
            aria-current="page"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--brand-navy);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="7" cy="7" r="2.6"></circle>
              <circle cx="7" cy="17" r="2.6"></circle>
              <path d="M20 5.5L8.8 15M9.6 8.6L20 18.5"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Serviços</span
            >
          </a>
          <a
            href="HorariosMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 2"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Horários</span
            >
          </a>
          <a
            href="MaisMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
              <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Mais</span
            >
          </a>
        </nav>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
