<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Horários (mobile)</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #f2f7f8;
            --surface-100: #ffffff;
            --surface-200: #f2f7f8;
            --ink: #0b2530;
            --ink-muted: #4c6672;
            --border: #8fb0b7;
            --brand-navy: #185280;
            --brand-teal: #0f9e9e;
            --brand-teal-dark: #09424b;
            --danger: #a3332b;
            --danger-bg: #fbecea;
            --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-full: 999px;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: var(--brand-teal-dark);
          }
          button {
            font-family: inherit;
            cursor: pointer;
          }
          input,
          select,
          textarea {
            font-family: inherit;
          }
          ::placeholder {
            color: var(--ink-muted);
            opacity: 0.7;
          }
        </style>
      </helmet>
      <div
        style="width: 100%; min-height: 100%; background: var(--surface-200); position: relative"
      >
        <div
          style="
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--surface-100);
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <div style="display: flex; align-items: center; gap: 9px">
            <div
              style="
                width: 30px;
                height: 30px;
                border-radius: 9px;
                background: var(--brand-navy);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
              "
            >
              <span
                style="
                  font-family: var(--font-display);
                  font-weight: 700;
                  font-size: 14px;
                  color: #ffffff;
                "
                >D</span
              >
            </div>
            <div
              style="
                font-family: var(--font-display);
                font-weight: 700;
                font-size: 15px;
                color: var(--ink);
              "
            >
              Diva Studio
            </div>
          </div>
          <div
            style="
              width: 30px;
              height: 30px;
              border-radius: var(--radius-full);
              background: var(--surface-200);
              border: 1px solid var(--border);
              display: flex;
              align-items: center;
              justify-content: center;
              font-family: var(--font-sans);
              font-size: 13px;
              font-weight: 700;
              color: var(--brand-navy);
            "
          >
            I
          </div>
        </div>

        <div style="padding: 20px 18px 110px; display: flex; flex-direction: column; gap: 18px">
          <div>
            <h1
              style="
                margin: 0 0 4px;
                font-family: var(--font-display);
                font-size: 22px;
                line-height: 28px;
                font-weight: 600;
                color: var(--ink);
              "
            >
              Horários
            </h1>
            <p
              style="
                margin: 0;
                font-family: var(--font-sans);
                font-size: 13px;
                line-height: 18px;
                color: var(--ink-muted);
              "
            >
              Funcionamento por dia da semana.
            </p>
          </div>

          <div
            style="
              background: var(--surface-100);
              border: 1px solid var(--border);
              border-radius: var(--radius-md);
              overflow: hidden;
            "
          >
            <sc-for list="{{days}}" as="day" hint-placeholder-count="7">
              <div style="padding: 16px 18px; border-top: 1px solid var(--surface-200)">
                <div
                  style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:{{day.rowMargin}};"
                >
                  <div style="display: flex; align-items: center; gap: 12px">
                    <button
                      type="button"
                      onClick="{{day.toggle}}"
                      role="switch"
                      aria-checked="{{day.open}}"
                      aria-label="Alternar {{day.name}}"
                      style="{{day.switchTrack}}"
                    >
                      <span style="{{day.switchThumb}}"></span>
                    </button>
                    <span
                      style="
                        font-family: var(--font-sans);
                        font-size: 14px;
                        font-weight: 600;
                        color: var(--ink);
                      "
                      >{{day.name}}</span
                    >
                  </div>
                  <button
                    type="button"
                    aria-label="Adicionar intervalo em {{day.name}}"
                    onClick="{{day.addInterval}}"
                    style="
                      width: 30px;
                      height: 30px;
                      flex-shrink: 0;
                      background: var(--surface-200);
                      border: none;
                      border-radius: var(--radius-sm);
                      color: var(--brand-teal-dark);
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <svg
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.2"
                      stroke-linecap="round"
                    >
                      <path d="M12 5v14M5 12h14"></path>
                    </svg>
                  </button>
                </div>

                <sc-if value="{{day.open}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; flex-direction: column; gap: 10px">
                    <sc-for list="{{day.intervals}}" as="iv" hint-placeholder-count="1">
                      <div style="display: flex; align-items: flex-end; gap: 10px">
                        <div style="flex: 1">
                          <label
                            style="
                              display: block;
                              margin-bottom: 5px;
                              font-family: var(--font-sans);
                              font-size: 10px;
                              font-weight: 600;
                              letter-spacing: 0.02em;
                              text-transform: uppercase;
                              color: var(--ink-muted);
                            "
                            >Início</label
                          >
                          <input
                            type="time"
                            value="{{iv.start}}"
                            style="
                              width: 100%;
                              padding: 9px 10px;
                              border: 1px solid var(--border);
                              border-radius: var(--radius-sm);
                              font-size: 14px;
                              color: var(--ink);
                              background: var(--surface-100);
                            "
                          />
                        </div>
                        <div style="flex: 1">
                          <label
                            style="
                              display: block;
                              margin-bottom: 5px;
                              font-family: var(--font-sans);
                              font-size: 10px;
                              font-weight: 600;
                              letter-spacing: 0.02em;
                              text-transform: uppercase;
                              color: var(--ink-muted);
                            "
                            >Fim</label
                          >
                          <input
                            type="time"
                            value="{{iv.end}}"
                            style="
                              width: 100%;
                              padding: 9px 10px;
                              border: 1px solid var(--border);
                              border-radius: var(--radius-sm);
                              font-size: 14px;
                              color: var(--ink);
                              background: var(--surface-100);
                            "
                          />
                        </div>
                        <button
                          type="button"
                          aria-label="Remover intervalo"
                          onClick="{{iv.remove}}"
                          style="
                            width: 38px;
                            height: 38px;
                            flex-shrink: 0;
                            background: transparent;
                            border: 1px solid var(--border);
                            border-radius: var(--radius-sm);
                            color: var(--danger);
                            display: flex;
                            align-items: center;
                            justify-content: center;
                          "
                        >
                          <svg
                            width="15"
                            height="15"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                          >
                            <path d="M6 6l12 12M18 6L6 18"></path>
                          </svg>
                        </button>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{day.openFalse}}" hint-placeholder-val="{{false}}">
                  <div
                    style="font-family: var(--font-sans); font-size: 13px; color: var(--ink-muted)"
                  >
                    Fechado neste dia.
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>

          <button
            type="button"
            style="
              width: 100%;
              background: var(--brand-teal-dark);
              color: #ffffff;
              border: none;
              border-radius: var(--radius-sm);
              padding: 14px;
              font-family: var(--font-sans);
              font-size: 13px;
              font-weight: 600;
              letter-spacing: 0.02em;
              text-transform: uppercase;
            "
          >
            Salvar horários
          </button>
        </div>

        <nav
          aria-label="Navegação principal"
          style="
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9;
            background: var(--surface-100);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 6px 4px 10px;
          "
        >
          <a
            href="MainMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
            >
              <rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect>
              <path d="M3.5 9.8h17"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Agenda</span
            >
          </a>
          <a
            href="ServicosMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="7" cy="7" r="2.6"></circle>
              <circle cx="7" cy="17" r="2.6"></circle>
              <path d="M20 5.5L8.8 15M9.6 8.6L20 18.5"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Serviços</span
            >
          </a>
          <a
            href="HorariosMobile.dc.html"
            aria-current="page"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--brand-navy);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 2"></path>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Horários</span
            >
          </a>
          <a
            href="MaisMobile.dc.html"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 3px;
              padding: 6px 12px;
              text-decoration: none;
              color: var(--ink-muted);
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
            >
              <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
              <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
            </svg>
            <span style="font-family: var(--font-sans); font-size: 11px; font-weight: 600"
              >Mais</span
            >
          </a>
        </nav>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = {
            days: [
              { key: 'seg', name: 'Segunda', open: true, intervals: [{ start: '09:00', end: '18:00' }] },
              { key: 'ter', name: 'Terça', open: false, intervals: [] },
              { key: 'qua', name: 'Quarta', open: false, intervals: [] },
              { key: 'qui', name: 'Quinta', open: false, intervals: [] },
              { key: 'sex', name: 'Sexta', open: false, intervals: [] },
              { key: 'sab', name: 'Sábado', open: false, intervals: [] },
              { key: 'dom', name: 'Domingo', open: false, intervals: [] }
            ]
          };
        }

        toggleDay(key) {
          this.setState({
            days: this.state.days.map(d => {
              if (d.key !== key) return d;
              const open = !d.open;
              return { ...d, open, intervals: open && d.intervals.length === 0 ? [{ start: '09:00', end: '18:00' }] : d.intervals };
            })
          });
        }
        addInterval(key) {
          this.setState({
            days: this.state.days.map(d => d.key === key ? { ...d, open: true, intervals: [...d.intervals, { start: '09:00', end: '18:00' }] } : d)
          });
        }
        removeInterval(key, idx) {
          this.setState({
            days: this.state.days.map(d => d.key === key ? { ...d, intervals: d.intervals.filter((_, i) => i !== idx) } : d)
          });
        }

        renderVals() {
          const days = this.state.days.map(d => ({
            name: d.name,
            open: d.open,
            openFalse: !d.open,
            rowMargin: d.open && d.intervals.length ? '14px' : '0px',
            toggle: () => this.toggleDay(d.key),
            addInterval: () => this.addInterval(d.key),
            switchTrack: 'position:relative;width:38px;height:22px;border-radius:999px;border:none;padding:0;background:' + (d.open ? 'var(--brand-teal-dark)' : 'var(--border)') + ';flex-shrink:0;',
            switchThumb: 'position:absolute;top:3px;left:' + (d.open ? '19px' : '3px') + ';width:16px;height:16px;border-radius:999px;background:#ffffff;',
            intervals: d.intervals.map((iv, idx) => ({
              start: iv.start,
              end: iv.end,
              remove: () => this.removeInterval(d.key, idx)
            }))
          }));
          return { days };
        }
      }
    </script>
  </body>
</html>
