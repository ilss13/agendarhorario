<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Serviços</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #f2f7f8;
            --surface-100: #ffffff;
            --surface-200: #f2f7f8;
            --ink: #0b2530;
            --ink-muted: #4c6672;
            --border: #8fb0b7;
            --brand-navy: #185280;
            --brand-teal: #0f9e9e;
            --brand-teal-dark: #09424b;
            --danger: #a3332b;
            --danger-bg: #fbecea;
            --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-full: 999px;
          }
          * {
            box-sizing: border-box;
          }
          a {
            color: var(--brand-teal-dark);
          }
          a:hover {
            color: var(--brand-navy);
          }
          button {
            font-family: inherit;
            cursor: pointer;
          }
          input,
          select,
          textarea {
            font-family: inherit;
          }
          ::placeholder {
            color: var(--ink-muted);
            opacity: 0.7;
          }
        </style>
      </helmet>
      <div style="display: flex; width: 100%; min-height: 100%; background: var(--surface-200)">
        <nav
          aria-label="Navegação principal"
          style="
            width: 250px;
            flex-shrink: 0;
            background: var(--surface-100);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 18px;
          "

              <div
                style="

                  height: 36px;
                  border-radius: 10px;
                  background: var(--brand-navy);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  flex-shrink: 0;
                  overflow: hidden;
                "
              >
                <span

                    font-family: var(--font-display);
                    font-weight: 700;
                    font-size: 16px;
                    color: #ffffff;

              </div>
              <div>
                <div
                  style="

                    font-weight: 700;
                    font-size: 16px;

                <div
                  style="font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted)"

              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 3px">
              <a

                  gap: 11px;
                  padding: 10px 12px;
                  border-radius: 10px;

                  font-family: var(--font-sans);

                  font-weight: 600;
                  color: var(--ink);

                  width="18"
                  height="18"

                  fill="none"
                  stroke="currentColor"

              <a

                </svg>

              </a>
              <a

                  align-items: center;

                  padding: 10px 12px;
                  border-radius: 10px;
                  text-decoration: none;
                  font-family: var(--font-sans);
                  font-size: 14px;
                  font-weight: 600;
                  color: #ffffff;
                  background: var(--brand-navy);
                "
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"

                  stroke-linejoin="round"
                >
                  <circle cx="7" cy="7" r="2.6"></circle>
                  <circle cx="7" cy="17" r="2.6"></circle>
                  <path d="M20 5.5L8.8 15M9.6 8.6L20 18.5"></path>
                </svg>
                Serviços
              </a>
              <a
                href="Horarios.dc.html"

                  display: flex;

                  gap: 11px;
                  padding: 10px 12px;

                  font-family: var(--font-sans);
                  font-size: 14px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                <svg
                  width="18"

                  viewBox="0 0 24 24"

                  stroke-width="1.8"
                  stroke-linecap="round"

                  <circle cx="12" cy="12" r="8.5"></circle>

              <a
                href="Excecoes.dc.html"

                  display: flex;

                  gap: 11px;
                  padding: 10px 12px;
                  border-radius: 10px;
                  text-decoration: none;
                  font-family: var(--font-sans);
                  font-size: 14px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                >
                  <rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect>
                  <path d="M3.5 9.8h17M9 14.3h6"></path>
                </svg>
                Exceções / Feriados
              </a>
              <a
                href="Assinatura.dc.html"
                style="

                  font-family: var(--font-sans);
                  font-size: 14px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="5.5" width="18" height="13" rx="2.5"></rect>
                  <path d="M3 9.8h18"></path>
                </svg>
                Assinatura
              </a>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
              <div
                style="
                  width: 30px;
                  height: 30px;
                  border-radius: var(--radius-full);
                  background: var(--surface-200);
                  border: 1px solid var(--border);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-family: var(--font-sans);
                  font-size: 13px;
                  font-weight: 700;
                  color: var(--brand-navy);
                "
              >
                I
              </div>
              <div
                style="
                  font-family: var(--font-sans);
                  font-size: 14px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                Igor
              </div>
            </div>
            <button
              type="button"
              style="
                display: flex;
                align-items: center;
                gap: 10px;
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 9px 12px;
                font-family: var(--font-sans);
                font-size: 13px;
                font-weight: 600;
                color: var(--ink-muted);
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                <path d="M16 17l5-5-5-5M21 12H9"></path>
              </svg>
              Sair
            </button>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 10px 8px 0;
                border-top: 1px solid var(--surface-200);
                margin-top: 2px;
              "
            >
              <div
                style="
                  width: 18px;
                  height: 18px;
                  border-radius: 5px;
                  background: var(--brand-navy);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  flex-shrink: 0;
                "
              >
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="3.5"
                    y="5"
                    width="17"
                    height="15.5"
                    rx="3"
                    stroke="#ffffff"
                    stroke-width="2.4"
                  ></rect>
                  <path
                    d="M8.3 14.6l2 2 4.2-4.4"
                    stroke="#3fd6c6"
                    stroke-width="2.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </div>
              <span style="font-family: var(--font-sans); font-size: 11px; color: var(--ink-muted)"
                >Powered by
                <span style="color: var(--ink); font-weight: 600">agendarhorario.com</span></span
              >
            </div>
          </div>
        </nav>

        <div
          style="
            flex: 1;
            padding: 40px 48px 64px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 960px;
          "
        >
          <div
            style="
              display: flex;
              align-items: flex-start;
              justify-content: space-between;
              gap: 24px;
              flex-wrap: wrap;
            "
          >
            <div>
              <h1
                style="
                  margin: 0 0 6px;
                  font-family: var(--font-display);
                  font-size: 28px;
                  line-height: 36px;
                  font-weight: 600;
                  color: var(--ink);
                "
              >
                Serviços
              </h1>
              <p
                style="
                  margin: 0;
                  font-family: var(--font-sans);
                  font-size: 16px;
                  line-height: 24px;
                  color: var(--ink-muted);
                "
              >
                Tipos de atendimento oferecidos pela sua empresa.
              </p>
            </div>
            <button
              type="button"
              style="
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: var(--brand-teal-dark);
                color: #ffffff;
                border: none;
                border-radius: var(--radius-sm);
                padding: 12px 20px;
                font-family: var(--font-sans);
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.02em;
                text-transform: uppercase;
                white-space: nowrap;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              >
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              Novo serviço
            </button>
          </div>

          <div style="position: relative; max-width: 360px">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--ink-muted)"
              stroke-width="1.8"
              stroke-linecap="round"
              style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%)"
            >
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="M20 20l-4.3-4.3"></path>
            </svg>
            <label
              for="srv-search"
              style="
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
              "
              >Buscar serviço por nome</label
            >
            <input
              id="srv-search"
              type="text"
              placeholder="Buscar por nome..."
              style="
                width: 100%;
                padding: 11px 14px 11px 40px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: 14px;
                color: var(--ink);
                background: var(--surface-100);
              "
            />
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px">
            <div
              style="
                background: var(--surface-100);
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                padding: 20px 22px;
                display: flex;
                align-items: center;
                gap: 18px;
              "
            >
              <div
                style="
                  width: 46px;
                  height: 46px;
                  border-radius: var(--radius-md);
                  background: rgba(15, 158, 158, 0.12);
                  display: flex;

                  justify-content: center;
                  flex-shrink: 0;
                "
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--brand-teal-dark)"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 15c2-5 4-8 8-8s6 3 8 8"></path>
                  <path d="M4 15c2 1.5 4.5 2.5 8 2.5s6-1 8-2.5"></path>
                </svg>

                    font-size: 16px;
                    font-weight: 600;
                    color: var(--ink);
                  "
                >
                  Sombrancelha
                </div>
                <div
                  style="
                    font-family: var(--font-sans);
                    font-size: 13px;
                    color: var(--ink-muted);
                    margin-top: 2px;
                  "
                >
                  30 min · R$ 50,00
                </div>
              </div>
              <span
                style="
                  font-family: var(--font-sans);
                  font-size: 11px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  padding: 4px 11px;
                  border-radius: 999px;
                  background: rgba(15, 158, 158, 0.14);
                  color: var(--brand-teal-dark);
                "
                >Ativo</span
              >
              <button
                type="button"
                aria-label="Editar Sombrancelha"
                style="
                  background: transparent;
                  border: 1px solid var(--border);
                  border-radius: var(--radius-sm);
                  padding: 9px;
                  color: var(--ink-muted);
                  display: flex;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path>
                </svg>
              </button>
              <button
                type="button"
                style="
                  background: transparent;
                  border: 1px solid var(--border);
                  border-radius: var(--radius-sm);
                  padding: 9px 14px;
                  font-family: var(--font-sans);
                  font-size: 12px;
                  font-weight: 600;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                  color: var(--danger);
                "
              >
                Remover
              </button>
            </div>
          </div>
        </div>
      </div>
    </x-dc>
