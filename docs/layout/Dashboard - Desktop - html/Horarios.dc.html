        <div
          style="

            padding: 40px 48px 64px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 860px;
          "
        >
          <div>
            <h1
              style="

                font-family: var(--font-display);
                font-size: 28px;
                line-height: 36px;
                font-weight: 600;
                color: var(--ink);
              "

            </h1>
            <p
              style="
                margin: 0;
                font-family: var(--font-sans);
                font-size: 16px;
                line-height: 24px;
                color: var(--ink-muted);
              "
            >
              Defina os intervalos de funcionamento por dia da semana.
            </p>
          </div>

          <div
            style="
              background: var(--surface-100);
              border: 1px solid var(--border);
              border-radius: var(--radius-md);
              overflow: hidden;
            "
          >
            <sc-for list="{{days}}" as="day" hint-placeholder-count="7">
              <div style="padding: 20px 26px; border-top: 1px solid var(--surface-200)">
                <div
                  style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:{{day.rowMargin}};"
                >
                  <div style="display: flex; align-items: center; gap: 14px">
                    <button
                      type="button"
                      onClick="{{day.toggle}}"
                      role="switch"
                      aria-checked="{{day.open}}"
                      aria-label="Alternar {{day.name}}"
                      style="{{day.switchTrack}}"
                    >
                      <span style="{{day.switchThumb}}"></span>
                    </button>
                    <span
                      style="
                        font-family: var(--font-sans);
                        font-size: 15px;
                        font-weight: 600;
                        color: var(--ink);
                      "

                  <button

                    onClick="{{day.addInterval}}"
                    style="

                      border: none;
                      color: var(--brand-teal-dark);
                      font-family: var(--font-sans);
                      font-size: 13px;
                      font-weight: 600;
                      display: flex;
                      align-items: center;

                              border-radius: var(--radius-sm);
                              font-size: 14px;

    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = {
            days: [
              { key: 'seg', name: 'Segunda', open: true, intervals: [{ start: '09:00', end: '18:00' }] },
              { key: 'ter', name: 'Terça', open: false, intervals: [] },
              { key: 'qua', name: 'Quarta', open: false, intervals: [] },
              { key: 'qui', name: 'Quinta', open: false, intervals: [] },
              { key: 'sex', name: 'Sexta', open: false, intervals: [] },
              { key: 'sab', name: 'Sábado', open: false, intervals: [] },
              { key: 'dom', name: 'Domingo', open: false, intervals: [] }
            ]
          };
        }

        toggleDay(key) {
          this.setState({
            days: this.state.days.map(d => {
              if (d.key !== key) return d;
              const open = !d.open;
              return { ...d, open, intervals: open && d.intervals.length === 0 ? [{ start: '09:00', end: '18:00' }] : d.intervals };
            })
          });
        }
        addInterval(key) {
          this.setState({
            days: this.state.days.map(d => d.key === key ? { ...d, open: true, intervals: [...d.intervals, { start: '09:00', end: '18:00' }] } : d)
          });
        }
        removeInterval(key, idx) {
          this.setState({
            days: this.state.days.map(d => d.key === key ? { ...d, intervals: d.intervals.filter((_, i) => i !== idx) } : d)
          });
        }

        renderVals() {
          const days = this.state.days.map(d => ({
            name: d.name,
            open: d.open,
            openFalse: !d.open,
            rowMargin: d.open && d.intervals.length ? '16px' : '0px',
            toggle: () => this.toggleDay(d.key),
            addInterval: () => this.addInterval(d.key),
            switchTrack: 'position:relative;width:38px;height:22px;border-radius:999px;border:none;padding:0;background:' + (d.open ? 'var(--brand-teal-dark)' : 'var(--border)') + ';flex-shrink:0;',
            switchThumb: 'position:absolute;top:3px;left:' + (d.open ? '19px' : '3px') + ';width:16px;height:16px;border-radius:999px;background:#ffffff;transition:left .15s;',
            intervals: d.intervals.map((iv, idx) => ({
              start: iv.start,
              end: iv.end,
              remove: () => this.removeInterval(d.key, idx)
            }))
          }));
          return { days };
        }
      }
    </script>
