<label class="search">
  <span class="sr-only">{{ label }}</span>
  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none">
    <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8" />
    <path d="M20 20l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
  </svg>
  <input
    type="search"
    [placeholder]="placeholder"
    [ngModel]="value()"
    (ngModelChange)="onInput($event)"
    [attr.aria-label]="label"
    autocomplete="off"
  />
  @if (value()) {
    <button type="button" class="clear" (click)="clear()" aria-label="Limpar busca">×</button>
  }
</label>
